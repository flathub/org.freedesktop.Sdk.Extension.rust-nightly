id: org.freedesktop.Sdk.Extension.rust-nightly
branch: '23.08'
runtime: org.freedesktop.Sdk
build-extension: true
sdk: org.freedesktop.Sdk
runtime-version: '23.08'
separate-locales: false

modules:

  - name: rust
    buildsystem: simple
    build-commands:
      - install -Dm0644 ${FLATPAK_ID}.appdata.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm0755 apply_extra ${FLATPAK_DEST}/bin/apply_extra
    sources:
      - type: extra-data
        only-arches:
          - aarch64
        url: https://static.rust-lang.org/dist/2024-10-16/rust-nightly-aarch64-unknown-linux-gnu.tar.gz
        sha256: 7f31cc2f401760809c6b94e4a5913f24dcd406389e40246c474bbd603bdbb556
        filename: rust-nightly.tar.xz
        size: 511543969
      - type: extra-data
        only-arches:
          - x86_64
        url: https://static.rust-lang.org/dist/2024-10-16/rust-nightly-x86_64-unknown-linux-gnu.tar.gz
        sha256: f2817a1af6a5f488c3db45eefa19cf2c91d66cacca964779dcb2ecb3978bed5b
        filename: rust-nightly.tar.xz
        size: 364770484
      - type: extra-data
        url: https://static.rust-lang.org/dist/2024-10-16/rust-src-nightly.tar.gz
        sha256: c7bc28b4e9d12a13fb614754f4ecea671c637144ef5383c968b1b4fb7586b747
        filename: rust-src-nightly.tar.xz
        size: 4501843
      - type: extra-data
        only-arches:
          - x86_64
        url: https://github.com/rui314/mold/releases/download/v2.34.1/mold-2.34.1-x86_64-linux.tar.gz
        sha256: dafd02fe19c51818aa22c9d569393616b1a85a2220d6fb32ba3728d351074e59
        filename: mold-linux.tar.gz
        size: 8249501
        x-checker-data:
          type: anitya
          project-id: 241732
          stable-only: true
          url-template: https://github.com/rui314/mold/releases/download/v$version/mold-$version-x86_64-linux.tar.gz
      - type: extra-data
        only-arches:
          - aarch64
        url: https://github.com/rui314/mold/releases/download/v2.34.1/mold-2.34.1-aarch64-linux.tar.gz
        sha256: ea5f1266b92aa17c262210766dfd7cfd6637a6a94ac4c75e5def50d534ca24c1
        filename: mold-linux.tar.gz
        size: 8296932
        x-checker-data:
          type: anitya
          project-id: 241732
          stable-only: true
          url-template: https://github.com/rui314/mold/releases/download/v$version/mold-$version-aarch64-linux.tar.gz
      - type: extra-data
        only-arches:
          - x86_64
        url: https://github.com/rust-lang/rust-analyzer/releases/download/2024-10-14/rust-analyzer-x86_64-unknown-linux-gnu.gz
        sha256: e354e0f56b2517742f721017f253613061e5cf7a76f73796711e4c7c4a2fd70c
        filename: rust-analyzer.gz
        size: 15356779
        x-checker-data:
          type: json
          url: https://api.github.com/repos/rust-analyzer/rust-analyzer/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="rust-analyzer-x86_64-unknown-linux-gnu.gz") | .browser_download_url
      - type: extra-data
        only-arches:
          - aarch64
        url: https://github.com/rust-lang/rust-analyzer/releases/download/2024-10-14/rust-analyzer-aarch64-unknown-linux-gnu.gz
        sha256: 09a9bee861a6a3c1e2e4d434243a7d7eb58d11b9ad8389cf12fca594e38d0a50
        filename: rust-analyzer.gz
        size: 15290152
        x-checker-data:
          type: json
          url: https://api.github.com/repos/rust-analyzer/rust-analyzer/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="rust-analyzer-aarch64-unknown-linux-gnu.gz") | .browser_download_url
      - type: file
        path: org.freedesktop.Sdk.Extension.rust-nightly.appdata.xml
      - type: script
        commands:
          - mkdir -p rust-nightly && tar -xf rust-nightly.tar.xz --strip=1 -C rust-nightly
          - mkdir -p rust-src-nightly && tar -xf rust-src-nightly.tar.xz --strip=1 -C rust-src-nightly
          - mkdir -p mold && tar -xf mold-linux.tar.gz --strip=1 -C mold
          - gunzip rust-analyzer.gz
          - ./rust-nightly/install.sh --prefix=/app/extra/sdk/rust-nightly --without=rust-docs --without=rust-docs-json-preview
            --disable-ldconfig > /dev/null
          - ./rust-src-nightly/install.sh --prefix=/app/extra/sdk/rust-nightly --disable-ldconfig > /dev/null
          - install -Dm0755 mold/bin/mold -t /app/extra/sdk/rust-nightly/bin
          - install -Dm0755 rust-analyzer -t /app/extra/sdk/rust-nightly/bin
          - rm -rf rust-nightly.tar.xz rust-src-nightly.tar.xz mold-linux.tar.gz rust-analyzer.gz rust-analyzer mold rust-src-nightly
            rust-nightly sdk/rust-nightly/etc sdk/rust-nightly/share
        dest-filename: apply_extra
