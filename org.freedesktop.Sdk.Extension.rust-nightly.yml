id: org.freedesktop.Sdk.Extension.rust-nightly
branch: '25.08'
runtime: org.freedesktop.Sdk
build-extension: true
sdk: org.freedesktop.Sdk
runtime-version: '25.08'
separate-locales: false
build-options:
  strip: false
  no-debuginfo: true
  env:
    SDK_PREFIX: /usr/lib/sdk/rust-nightly
cleanup:
  - /etc
  - /share/doc
  - /share/man
  - /share/zsh
modules:
  - name: rust
    buildsystem: simple
    build-commands:
      - |
        cd rust
        ./install.sh --prefix=${SDK_PREFIX} \
          --without=rust-docs,rust-docs-json-preview \
          --disable-ldconfig --verbose

      - |
        cd rust-src
        ./install.sh --prefix=${SDK_PREFIX} --disable-ldconfig \
          --verbose

      - install -Dm0755 mold/bin/mold ${SDK_PREFIX}/bin/mold
      - install -Dm0755 mold/bin/ld.mold ${SDK_PREFIX}/bin/ld.mold

      - |
        gunzip rust-analyzer.gz
        install -Dm0755 rust-analyzer ${SDK_PREFIX}/bin/rust-analyzer

      - install -Dm0755 enable.sh ${SDK_PREFIX}/enable.sh

      - |
        set -euo pipefail

        find "${FLATPAK_DEST}/share/doc" -type f \
          \( \
            -iname 'LICEN*' -o \
            -iname 'COPYING*' -o \
            -iname 'COPYRIGHT*' \
          \) \
          | while read -r i; do
              module="$(basename "$(dirname "$i")")"
              install -Dm644 \
                "$i" \
                "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/${module}/$(basename "$i")"
            done

      - install -Dm0644 ${FLATPAK_ID}.appdata.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    post-install:
      - |
        set -euo pipefail

        export PATH="$PATH:$SDK_PREFIX/bin"

        tools=(
          rustc
          cargo
          cargo-fmt
          rustfmt
          cargo-clippy
          mold
        )

        for i in "${tools[@]}"; do
          echo
          echo "Launching ${i}"
          "${i}" --version
          echo
        done

        find_args=()

        for i in "${tools[@]}" \
          cargo-miri \
          rust-demangler \
          rls \
          rust-gdbgui \
          rust-lldb; do
          find_args+=( ! -name "$i" )
        done

        while read -r i; do
          echo
          echo "Launching $(basename "$i")"
          "$i" --version
          echo
        done < <(
          find "${SDK_PREFIX}/bin" -maxdepth 1 -type f "${find_args[@]}"
        )
    sources:
      - type: archive
        only-arches:
          - aarch64
        url: https://static.rust-lang.org/dist/2026-08-16/rust-nightly-aarch64-unknown-linux-gnu.tar.gz
        sha256: 23c387436a0821e38aa6f4888eb9a03335bb04fec319ae48df922a9457e3d2fc
        dest: rust
      - type: archive
        only-arches:
          - x86_64
        url: https://static.rust-lang.org/dist/2026-08-16/rust-nightly-x86_64-unknown-linux-gnu.tar.gz
        sha256: 8686e83976db88deabb4229ecf63068db12e268f08d694e236992713f65fb96e
        dest: rust
      - type: archive
        url: https://static.rust-lang.org/dist/2026-08-16/rust-src-nightly.tar.gz
        sha256: a043f2fb6e5240779cdaee6c9e078c67dfb904de2dcdfec5d2f247edee877484
        dest: rust-src
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/rui314/mold/releases/download/v2.42.0/mold-2.42.0-x86_64-linux.tar.gz
        sha256: f5ed2f6e31d1ada4f07fe766fe0de7a73104d1c5cdc59086fcecc16a43720b6d
        dest: mold
        x-checker-data:
          type: anitya
          project-id: 241732
          stable-only: true
          url-template: https://github.com/rui314/mold/releases/download/v$version/mold-$version-x86_64-linux.tar.gz
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/rui314/mold/releases/download/v2.42.0/mold-2.42.0-aarch64-linux.tar.gz
        sha256: 3c9a0a3624aac8a2007569ae50c33b3129a0f0ae8bcc974aeee2f8939d295190
        dest: mold
        x-checker-data:
          type: anitya
          project-id: 241732
          stable-only: true
          url-template: https://github.com/rui314/mold/releases/download/v$version/mold-$version-aarch64-linux.tar.gz
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/rust-lang/rust-analyzer/releases/download/2026-08-10.1/rust-analyzer-x86_64-unknown-linux-gnu.gz
        sha256: d42908a7dc7b89250ae881a0919e477296843665c98574ecc8fe16ba60cecefb
        dest-filename: rust-analyzer.gz
        x-checker-data:
          type: json
          url: https://api.github.com/repos/rust-analyzer/rust-analyzer/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="rust-analyzer-x86_64-unknown-linux-gnu.gz") | .browser_download_url
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/rust-lang/rust-analyzer/releases/download/2026-08-10.1/rust-analyzer-aarch64-unknown-linux-gnu.gz
        sha256: a7eb3a97865dd189ad4fff526fbe73559bece876fdbd641e0f50f39271043542
        dest-filename: rust-analyzer.gz
        x-checker-data:
          type: json
          url: https://api.github.com/repos/rust-analyzer/rust-analyzer/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="rust-analyzer-aarch64-unknown-linux-gnu.gz") | .browser_download_url
      - type: script
        commands:
          - export PATH=$PATH:/usr/lib/sdk/rust-nightly/bin
        dest-filename: enable.sh
      - type: file
        path: org.freedesktop.Sdk.Extension.rust-nightly.appdata.xml
