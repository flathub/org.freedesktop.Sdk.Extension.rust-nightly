id: org.freedesktop.Sdk.Extension.rust-nightly
branch: '25.08'
runtime: org.freedesktop.Sdk
build-extension: true
sdk: org.freedesktop.Sdk
runtime-version: '25.08'
separate-locales: false

modules:

  - name: rust
    buildsystem: simple
    build-commands:
      - install -Dm0644 ${FLATPAK_ID}.appdata.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm0755 apply_extra ${FLATPAK_DEST}/bin/apply_extra
      - mkdir -p ${FLATPAK_DEST}/bin
      - ln -sf /usr/lib/sdk/rust-nightly/extra/sdk/rust-nightly/lib ${FLATPAK_DEST}
      - |
        binaries=(
            "cargo"
            "cargo-clippy"
            "cargo-fmt"
            "cargo-miri"
            "clippy-driver"
            "miri"
            "mold"
            "rls"
            "rust-analyzer"
            "rustc"
            "rustdoc"
            "rustfmt"
            "rust-gdb"
            "rust-gdbgui"
            "rust-lldb"
        )
        for i in ${binaries[@]}; do
          ln -s /usr/lib/sdk/rust-nightly/extra/sdk/rust-nightly/bin/$i ${FLATPAK_DEST}/bin/$i
        done
    sources:
      - type: extra-data
        only-arches:
          - aarch64
        url: https://static.rust-lang.org/dist/2026-01-18/rust-nightly-aarch64-unknown-linux-gnu.tar.gz
        sha256: 66cea5c8a61f1141707128a0520f60cbd34166c24072a6a47f70ad7129a0fca2
        filename: rust-nightly.tar.xz
        size: 326171954
      - type: extra-data
        only-arches:
          - x86_64
        url: https://static.rust-lang.org/dist/2026-01-18/rust-nightly-x86_64-unknown-linux-gnu.tar.gz
        sha256: 88d2b4ce4a7769e7421d6f3892ac77d75e9a02c642e64dacd23e12d108914908
        filename: rust-nightly.tar.xz
        size: 378923481
      - type: extra-data
        url: https://static.rust-lang.org/dist/2026-01-18/rust-src-nightly.tar.gz
        sha256: 10772fb235497c638c650b0be91714bd069a0e25f0433d007d2d7a1e2877df09
        filename: rust-src-nightly.tar.xz
        size: 5716917
      - type: extra-data
        only-arches:
          - x86_64
        url: https://github.com/rui314/mold/releases/download/v2.40.4/mold-2.40.4-x86_64-linux.tar.gz
        sha256: 4c999e19ffa31afa5aa429c679b665d5e2ca5a6b6832ad4b79668e8dcf3d8ec1
        filename: mold-linux.tar.gz
        size: 5069795
        x-checker-data:
          type: anitya
          project-id: 241732
          stable-only: true
          url-template: https://github.com/rui314/mold/releases/download/v$version/mold-$version-x86_64-linux.tar.gz
      - type: extra-data
        only-arches:
          - aarch64
        url: https://github.com/rui314/mold/releases/download/v2.40.4/mold-2.40.4-aarch64-linux.tar.gz
        sha256: c799b9ccae8728793da2186718fbe53b76400a9da396184fac0c64aa3298ec37
        filename: mold-linux.tar.gz
        size: 5008389
        x-checker-data:
          type: anitya
          project-id: 241732
          stable-only: true
          url-template: https://github.com/rui314/mold/releases/download/v$version/mold-$version-aarch64-linux.tar.gz
      - type: extra-data
        only-arches:
          - x86_64
        url: https://github.com/rust-lang/rust-analyzer/releases/download/2026-01-12/rust-analyzer-x86_64-unknown-linux-gnu.gz
        sha256: 303d0fa552a769de7ee1afcc44b3ae6db8f86e0b36beb3e8dd7748f43b2b8c24
        filename: rust-analyzer.gz
        size: 16749194
        x-checker-data:
          type: json
          url: https://api.github.com/repos/rust-analyzer/rust-analyzer/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="rust-analyzer-x86_64-unknown-linux-gnu.gz") | .browser_download_url
      - type: extra-data
        only-arches:
          - aarch64
        url: https://github.com/rust-lang/rust-analyzer/releases/download/2026-01-12/rust-analyzer-aarch64-unknown-linux-gnu.gz
        sha256: 7837a46be266b2782c75289a577c8201e5399186f09edc76eefb8dd7b4cffad2
        filename: rust-analyzer.gz
        size: 16503306
        x-checker-data:
          type: json
          url: https://api.github.com/repos/rust-analyzer/rust-analyzer/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="rust-analyzer-aarch64-unknown-linux-gnu.gz") | .browser_download_url
      - type: file
        path: org.freedesktop.Sdk.Extension.rust-nightly.appdata.xml
      - type: script
        commands:
          - mkdir -p rust-nightly && tar -xf rust-nightly.tar.xz --strip=1 -C rust-nightly
          - mkdir -p rust-src-nightly && tar -xf rust-src-nightly.tar.xz --strip=1 -C rust-src-nightly
          - mkdir -p mold && tar -xf mold-linux.tar.gz --strip=1 -C mold
          - gunzip rust-analyzer.gz
          - ./rust-nightly/install.sh --prefix=/app/extra/sdk/rust-nightly --without=rust-docs --without=rust-docs-json-preview
            --disable-ldconfig > /dev/null
          - ./rust-src-nightly/install.sh --prefix=/app/extra/sdk/rust-nightly --disable-ldconfig > /dev/null
          - install -Dm0755 mold/bin/mold -t /app/extra/sdk/rust-nightly/bin
          - install -Dm0755 rust-analyzer -t /app/extra/sdk/rust-nightly/bin
          - rm -rf rust-nightly.tar.xz rust-src-nightly.tar.xz mold-linux.tar.gz rust-analyzer.gz rust-analyzer mold rust-src-nightly
            rust-nightly sdk/rust-nightly/etc sdk/rust-nightly/share
        dest-filename: apply_extra
