id: org.freedesktop.Sdk.Extension.rust-nightly
branch: '24.08'
runtime: org.freedesktop.Sdk
build-extension: true
sdk: org.freedesktop.Sdk
runtime-version: '24.08'
separate-locales: false
build-options:
  strip: false
  no-debuginfo: true
  env:
    SDK_PREFIX: /usr/lib/sdk/rust-nightly
cleanup:
  - /etc
  - /share/doc
  - /share/man
  - /share/zsh
modules:
  - name: rust
    buildsystem: simple
    build-commands:
      - |
        cd rust
        ./install.sh --prefix=${SDK_PREFIX} \
          --without=rust-docs,rust-docs-json-preview \
          --disable-ldconfig --verbose

      - |
        cd rust-src
        ./install.sh --prefix=${SDK_PREFIX} --disable-ldconfig \
          --verbose

      - install -Dm0755 mold/bin/mold ${SDK_PREFIX}/bin/mold

      - |
        gunzip rust-analyzer.gz
        install -Dm0755 rust-analyzer ${SDK_PREFIX}/bin/rust-analyzer

      - install -Dm0755 enable.sh ${SDK_PREFIX}/enable.sh

      - |
        set -euo pipefail

        find "${FLATPAK_DEST}/share/doc" -type f \
          \( \
            -iname 'LICEN*' -o \
            -iname 'COPYING*' -o \
            -iname 'COPYRIGHT*' \
          \) \
          | while read -r i; do
              module="$(basename "$(dirname "$i")")"
              install -Dm644 \
                "$i" \
                "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/${module}/$(basename "$i")"
            done

      - install -Dm0644 ${FLATPAK_ID}.appdata.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    post-install:
      - |
        set -euo pipefail

        export PATH="$PATH:$SDK_PREFIX/bin"

        tools=(
          rustc
          cargo
          cargo-fmt
          rustfmt
          cargo-clippy
          mold
        )

        for i in "${tools[@]}"; do
          echo
          echo "Launching ${i}"
          "${i}" --version
          echo
        done

        find_args=()

        for i in "${tools[@]}" \
          cargo-miri \
          rust-demangler \
          rls \
          rust-gdbgui \
          rust-lldb; do
          find_args+=( ! -name "$i" )
        done

        while read -r i; do
          echo
          echo "Launching $(basename "$i")"
          "$i" --version
          echo
        done < <(
          find "${SDK_PREFIX}/bin" -maxdepth 1 -type f "${find_args[@]}"
        )
    sources:
      - type: archive
        only-arches:
          - aarch64
        url: https://static.rust-lang.org/dist/2026-08-02/rust-nightly-aarch64-unknown-linux-gnu.tar.gz
        sha256: 1da730eee634c93846bb29cf26ba9930195a2a68314cd5bf00186cbd13c58aeb
        dest: rust
      - type: archive
        only-arches:
          - x86_64
        url: https://static.rust-lang.org/dist/2026-08-02/rust-nightly-x86_64-unknown-linux-gnu.tar.gz
        sha256: b1769348eb23045df42e941006513e1840bd47672bd117fe037406685def3b63
        dest: rust
      - type: archive
        url: https://static.rust-lang.org/dist/2026-08-02/rust-src-nightly.tar.gz
        sha256: a94f2072e4351f8017fec6408416734c28750f98f4803536c837e824561812ca
        dest: rust-src
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/rui314/mold/releases/download/v2.41.0/mold-2.41.0-x86_64-linux.tar.gz
        sha256: a3696680d99e692970590a178bc3a33d78d60d1c6dc9db7a11b557b02b751f5d
        dest: mold
        x-checker-data:
          type: anitya
          project-id: 241732
          stable-only: true
          url-template: https://github.com/rui314/mold/releases/download/v$version/mold-$version-x86_64-linux.tar.gz
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/rui314/mold/releases/download/v2.41.0/mold-2.41.0-aarch64-linux.tar.gz
        sha256: 946de2774b06a71346bd59b55fddba610b65b8d93c3a4a1559cc84e103472710
        dest: mold
        x-checker-data:
          type: anitya
          project-id: 241732
          stable-only: true
          url-template: https://github.com/rui314/mold/releases/download/v$version/mold-$version-aarch64-linux.tar.gz
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/rust-lang/rust-analyzer/releases/download/2026-07-27/rust-analyzer-x86_64-unknown-linux-gnu.gz
        sha256: ac4f42ddbbd040d75d847e991894776485783e28beb744b9719a660a99abe115
        dest-filename: rust-analyzer.gz
        x-checker-data:
          type: json
          url: https://api.github.com/repos/rust-analyzer/rust-analyzer/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="rust-analyzer-x86_64-unknown-linux-gnu.gz") | .browser_download_url
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/rust-lang/rust-analyzer/releases/download/2026-07-27/rust-analyzer-aarch64-unknown-linux-gnu.gz
        sha256: 4cb0ca4675608e8d73a7f4e43ef733d1f69600845d504c35d2f9d9f240bd3486
        dest-filename: rust-analyzer.gz
        x-checker-data:
          type: json
          url: https://api.github.com/repos/rust-analyzer/rust-analyzer/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="rust-analyzer-aarch64-unknown-linux-gnu.gz") | .browser_download_url
      - type: script
        commands:
          - export PATH=$PATH:/usr/lib/sdk/rust-nightly/bin
        dest-filename: enable.sh
      - type: file
        path: org.freedesktop.Sdk.Extension.rust-nightly.appdata.xml
